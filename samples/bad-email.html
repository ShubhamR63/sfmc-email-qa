<!DOCTYPE html>
<html>
<head><title>Bad sample</title></head>
<body>
<custom name="opencounter" type="tracking"/>
<table>
  <tr><td>
    <a href="http://example.com/home" alias="hero banner"><img src="https://cdn.example.com/logo.png"></a>
  </td></tr>
  <tr><td>
    <a href="https://example.com/a" alias="promo"><img src="http://cdn.example.com/hero.jpg" alt="image"></a>
    <a href="https://example.com/b" alias="promo"><img src="https://cdn.example.com/b.jpg" alt=""></a>
  </td></tr>
  <tr><td>
    <a href="">Empty link</a>
    <a href="#" alias="hash">Hash link</a>
    <a href="www.example.com" alias="no_scheme">No scheme</a>
    <a href="https://example.com/text">Text link without alias</a>
    <a href="https://example.com/hidden" alias="hidden_link" style="display:none">Hidden</a>
    <a alias="no_href">No href attribute</a>
  </td></tr>
  <tr><td>
    <img src="https://cdn.example.com/pixel.gif" alt="Tracking pixel decor">
    <img alt="no src">
  </td></tr>
</table>
<custom name="usermatch" type="tracking" />
</body>
</html>
